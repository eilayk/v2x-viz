[workspace]
resolver = "3"
members = ["simulation", "visualizer"]

[workspace.dependencies]
env_logger = "0.11.11"
c-its-parser = { version = "2.2.4", features = ["time", "geo"] }
chrono = "0.4.45"
anyhow = "1.0.103"
log = "0.4.33"
geo-types = "0.7.19"
clap = { version = "4.6.1", features = ["derive"] }
